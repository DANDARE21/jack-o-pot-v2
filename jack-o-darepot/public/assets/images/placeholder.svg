<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b12" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <rect width="600" height="400" fill="url(#gridPattern)" />
  <circle cx="300" cy="200" r="180" fill="url(#glowRadial)" />

  <!-- Outer Tech Border -->
  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Corner Tech Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <path d="M 550 20 L 580 20 L 580 50" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 350 L 20 380 L 50 380" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 550 380 L 580 380 L 580 350" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />

  <!-- Center Framing Box -->
  <rect x="180" y="100" width="240" height="170" rx="16" fill="rgba(20, 22, 38, 0.7)" stroke="url(#neonGrad)" stroke-width="2" />

  <!-- Slot Reels / Vault Icon in Center -->
  <g transform="translate(255, 135)" fill="none" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Slot/Chest Symbol -->
    <rect x="0" y="8" width="90" height="65" rx="8" stroke="#a78bfa" stroke-width="2.5" fill="rgba(139, 92, 246, 0.15)" />
    <line x1="30" y1="8" x2="30" y2="73" stroke="rgba(255, 255, 255, 0.3)" stroke-dasharray="3 3" />
    <line x1="60" y1="8" x2="60" y2="73" stroke="rgba(255, 255, 255, 0.3)" stroke-dasharray="3 3" />
    <!-- 7 7 7 or Star symbols -->
    <circle cx="15" cy="40" r="5" fill="#f59e0b" stroke="none" />
    <circle cx="45" cy="40" r="5" fill="#ec4899" stroke="none" />
    <circle cx="75" cy="40" r="5" fill="#06b6d4" stroke="none" />
    <!-- Lever on right -->
    <path d="M 90 40 L 102 30 L 102 18" stroke="#f43f5e" stroke-width="2.5" />
    <circle cx="102" cy="15" r="4.5" fill="#f43f5e" stroke="none" />
  </g>

  <!-- Title / Label -->
  <text x="300" y="305" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#cbd5e1" text-anchor="middle">
    JACK-O-POT
  </text>
  <text x="300" y="328" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="1.5" fill="#64748b" text-anchor="middle">
    NO PREVIEW AVAILABLE
  </text>
</svg>
